name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail fast if app sources are missing
        run: |
          set -e
          test -f settings.gradle.kts || (echo "::error::settings.gradle.kts not found" && exit 1)
          test -f app/build.gradle.kts || (echo "::error::app/build.gradle.kts not found" && exit 1)
          echo "Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show APK details
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk
