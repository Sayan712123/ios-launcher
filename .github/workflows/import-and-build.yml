name: Import Source and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import sources if missing
        run: |
          if [ -f settings.gradle.kts ]; then
            echo "Sources already present, skipping import"
            exit 0
          fi
          set -u
          MIRRORS="
          https://n.uguu.se/QRlBUqCO.tgz
          https://x0.at/r4gN.tgz
          "
          ok=0
          for url in $MIRRORS; do
            echo "Trying $url"
            rm -rf /tmp/src /tmp/src.tgz
            if curl -fsSL --retry 2 --max-time 120 -o /tmp/src.tgz "$url"; then
              mkdir -p /tmp/src
              if tar xzf /tmp/src.tgz -C /tmp/src 2>/dev/null; then
                if find /tmp/src -maxdepth 4 -name 'settings.gradle.kts' | grep -q .; then
                  echo "Downloaded from $url"
                  ok=1
                  break
                fi
              fi
            fi
            echo "Failed: $url"
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Could not download sources from any mirror"
            exit 1
          fi
          SRC=$(find /tmp/src -maxdepth 4 -name 'settings.gradle.kts' -printf '%h\n' | head -1)
          echo "SRC=$SRC"
          cp -a "$SRC"/. ./
          echo "Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import iOS Launcher source code" || echo "nothing to commit"
          git push || echo "push skipped"

      - name: Fail fast if app sources are missing
        run: |
          set -e
          test -f settings.gradle.kts || (echo "::error::settings.gradle.kts not found" && exit 1)
          test -f app/build.gradle.kts || (echo "::error::app/build.gradle.kts not found" && exit 1)
          echo "Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show APK details
        run: |
          ls -lh app/build/outputs/apk/debug/ || true
          sha256sum app/build/outputs/apk/debug/*.apk || true
