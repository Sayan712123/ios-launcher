name: Import Source and Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and extract source
        run: |
          set -eux
          curl -fsSL -o /tmp/src.tgz "https://x0.at/r4gN.tgz"
          ls -l /tmp/src.tgz
          rm -rf /tmp/src && mkdir -p /tmp/src
          tar xzf /tmp/src.tgz -C /tmp/src
          SRC=$(find /tmp/src -maxdepth 4 -name 'settings.gradle.kts' -printf '%h\n' | head -1)
          echo "SRC=$SRC"
          test -n "$SRC"
          rsync -a --exclude '.git' "$SRC"/ ./
          echo "--- repo tree ---"
          find . -maxdepth 2 -not -path './.git*' | sort | head -40
          echo "Kotlin files: $(find app/src/main/java -name '*.kt' | wc -l)"

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import iOS Launcher source code" || echo "nothing to commit"
          git push

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode=summary

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ios-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Show APK details
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk
